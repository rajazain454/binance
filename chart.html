<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOL/USDC Live Quantitative Chart</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #131722;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    #header {
      height: 48px;
      background: #1e222d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: #d1d4dc;
      border-bottom: 1px solid #2a2e39;
    }
    .badge {
      background: #2962ff;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    #widget-container {
      width: 100%;
      height: calc(100% - 49px);
    }
  </style>
</head>
<body>
  <div id="header">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-weight: 700; color: #fff; font-size: 16px;">⚡ SOL/USDC LIVE TRADING CHART</span>
      <span class="badge">1-MINUTE SCALPER FEED</span>
    </div>
    <div style="font-size: 13px; color: #787b86;">
      Syncs with your bot targets: TP (+1.8%) | SL (-0.9%)
    </div>
  </div>
  <div id="widget-container">
    <div id="tradingview_sol" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:SOLUSDT",
      "interval": "1",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "enable_publishing": false,
      "hide_side_toolbar": false,
      "allow_symbol_change": true,
      "studies": [
        "STD;EMA",
        "STD;RSI"
      ],
      "container_id": "tradingview_sol"
    });
  </script>
</body>
</html>
