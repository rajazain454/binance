name: Binance AI 24/7 Cloud Trading Bot

on:
  schedule:
    # Runs at minute 7 and 37 past every hour (UTC)
    # Off-peak schedule avoids GitHub Actions peak queue congestion (:00 and :05)
    # and provides 30-minute position monitoring for Stop-Loss & Take-Profit exits.
    - cron: '7,37 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / mobile app

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code & Bot State
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Binance AI Market Scan
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
        run: |
          python bot.py --scan

      - name: Check & Dispatch Daily Performance Digest
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
        run: |
          python bot.py --digest

      - name: Persist Bot State & Trade Ledger
        run: |
          git config --global user.name "QuantLab Automated Bot"
          git config --global user.email "bot@quantlab.internal"
          git add bot_state.json logs/trade_history.csv config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist bot state and trade ledger [skip ci]" && git push)

      - name: Notify on Unexpected Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" -X POST -d '{"content": "⚠️ **QuantLab Cloud Alert**: The scheduled market scan encountered an error on GitHub Actions. Check repository Actions tab."}' "$DISCORD_WEBHOOK_URL" || true
          fi
