name: Binance AI 24/7 Cloud Trading Bot

on:
  schedule:
    # Runs at minute 7 and 37 past every hour (UTC)
    # Off-peak schedule avoids GitHub Actions peak queue congestion (:00 and :05)
    # and provides 30-minute position monitoring for Stop-Loss & Take-Profit exits.
    - cron: '7,37 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / mobile app

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code & Bot State
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Directory Structure
        run: |
          mkdir -p data logs models

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover -s tests -p "*.py"

      - name: Execute Live Binance AI Market Scan
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
        run: |
          python bot.py --scan

      - name: Check & Dispatch Daily Performance Digest
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BINANCE_PROXY: ${{ secrets.BINANCE_PROXY }}
        run: |
          python bot.py --digest

      - name: Persist Bot State & Trade Ledger
        run: |
          git config --global user.name "QuantLab Automated Bot"
          git config --global user.email "bot@quantlab.internal"
          git add bot_state.json logs/trade_history.csv config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist bot state and trade ledger [skip ci]" && git push)

      - name: Notify on Unexpected Failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import os, urllib.request, json
          url = os.getenv('DISCORD_WEBHOOK_URL', '').strip().replace('\r', '').replace('\n', '')
          if url.startswith('http'):
              payload = json.dumps({'content': '⚠️ **QuantLab Cloud Alert**: The scheduled market scan encountered an error on GitHub Actions. Check repository Actions tab.'}).encode('utf-8')
              req = urllib.request.Request(url, data=payload, headers={'Content-Type': 'application/json', 'User-Agent': 'QuantLab'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      print('Failure notification sent to Discord, status:', resp.status)
              except Exception as e:
                  print('Discord notify error:', e)
          "
